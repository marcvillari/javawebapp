<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nutrition Tracker</title>
<style>
  :root {
    --bg: #f5f6fa;
    --card: #ffffff;
    --text: #1d2130;
    --muted: #7a8195;
    --line: #e7e9f0;
    --accent: #5b5bf0;
    --protein: #ef5d7a;
    --carbs: #f5a524;
    --fat: #22b07d;
    --kcal: #5b5bf0;
    --danger: #e5484d;
    --shadow: 0 1px 2px rgba(20, 24, 40, .04), 0 4px 16px rgba(20, 24, 40, .06);
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1117;
      --card: #181b24;
      --text: #eceef4;
      --muted: #8d93a5;
      --line: #262a36;
      --accent: #8b8bff;
      --kcal: #8b8bff;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -.02em; }
  h2 { font-size: 16px; margin: 0; }
  .muted { color: var(--muted); }
  .date-nav { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .date-nav input { min-width: 0; width: auto; flex: 1; }
  button, input {
    font: inherit; color: inherit;
  }
  button {
    border: 1px solid var(--line); background: var(--card); border-radius: 10px;
    padding: 8px 12px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.icon { padding: 6px 10px; }
  button.ghost { border-color: transparent; background: transparent; color: var(--muted); }
  button.ghost:hover { color: var(--danger); }
  input {
    width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 10px;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; }
  .grid { display: grid; gap: 16px; }
  .top { grid-template-columns: 1.2fr 1fr; }
  @media (max-width: 720px) { .top { grid-template-columns: 1fr; } }

  /* Summary */
  .summary { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
  .ring { position: relative; width: 140px; height: 140px; flex: none; }
  .ring svg { transform: rotate(-90deg); }
  .ring .center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .ring .big { font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
  .macros { flex: 1; min-width: 200px; display: grid; gap: 12px; }
  .macro .row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
  .bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar > span { display: block; height: 100%; border-radius: 99px; transition: width .3s; }
  .over { color: var(--danger); }

  /* Weight */
  .weight-form { display: flex; gap: 8px; margin: 12px 0; }
  .weight-form input { flex: 1; }
  .stat-row { display: flex; gap: 16px; font-size: 13px; }
  .stat-row b { display: block; font-size: 18px; }
  #weightChart { width: 100%; height: 110px; display: block; margin-top: 10px; }

  /* Meals */
  .meals { grid-template-columns: repeat(2, 1fr); margin-top: 16px; }
  @media (max-width: 720px) { .meals { grid-template-columns: 1fr; } }
  .meal-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .meal-head .emoji { margin-right: 6px; }
  .food { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
  .food .name { font-weight: 500; overflow-wrap: anywhere; }
  .food .macros-sm { font-size: 12px; color: var(--muted); }
  .food .kc { font-weight: 600; white-space: nowrap; }
  .empty { font-size: 13px; color: var(--muted); padding: 8px 0; border-top: 1px solid var(--line); }
  .add-form { display: none; gap: 8px; margin-top: 10px; grid-template-columns: repeat(4, 1fr); }
  .add-form.open { display: grid; }
  .add-form .full { grid-column: 1 / -1; }
  .add-form label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 2px; }
  .add-btn { width: 100%; margin-top: 10px; border-style: dashed; color: var(--muted); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }

  /* Goals dialog */
  dialog { border: none; border-radius: var(--radius); padding: 20px; background: var(--card); color: var(--text); width: min(380px, calc(100% - 32px)); box-shadow: var(--shadow); }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  .goals-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0; }
  .goals-grid label { font-size: 12px; color: var(--muted); }
  .actions { display: flex; justify-content: flex-end; gap: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Nutrition Tracker</h1>
      <div class="muted" id="dateLabel"></div>
    </div>
    <div class="date-nav">
      <button class="icon" id="prevDay" aria-label="Previous day">&#8249;</button>
      <input type="date" id="datePicker" aria-label="Pick a date">
      <button class="icon" id="nextDay" aria-label="Next day">&#8250;</button>
      <button id="todayBtn">Today</button>
      <button id="goalsBtn">Goals</button>
    </div>
  </header>

  <div class="grid top">
    <section class="card">
      <h2>Daily summary</h2>
      <div class="summary" style="margin-top:12px">
        <div class="ring">
          <svg width="140" height="140" viewBox="0 0 140 140">
            <circle cx="70" cy="70" r="60" fill="none" stroke="var(--line)" stroke-width="12"/>
            <circle id="ringFg" cx="70" cy="70" r="60" fill="none" stroke="var(--kcal)" stroke-width="12"
                    stroke-linecap="round" stroke-dasharray="376.99" stroke-dashoffset="376.99"
                    style="transition: stroke-dashoffset .4s"/>
          </svg>
          <div class="center">
            <div class="big" id="kcalEaten">0</div>
            <div class="muted" style="font-size:12px" id="kcalLeft">of 0 kcal</div>
          </div>
        </div>
        <div class="macros" id="macroBars"></div>
      </div>
    </section>

    <section class="card">
      <h2>Body weight</h2>
      <form class="weight-form" id="weightForm">
        <input type="number" step="0.1" min="0" id="weightInput" placeholder="Weight (kg)" aria-label="Weight in kg">
        <button class="primary" type="submit">Save</button>
      </form>
      <div class="stat-row">
        <div><span class="muted">This day</span><b id="wToday">–</b></div>
        <div><span class="muted">Change (30d)</span><b id="wChange">–</b></div>
        <div><span class="muted">Entries</span><b id="wCount">0</b></div>
      </div>
      <svg id="weightChart" viewBox="0 0 300 110" preserveAspectRatio="none"></svg>
    </section>
  </div>

  <div class="grid meals" id="meals"></div>
</div>

<dialog id="goalsDialog">
  <h2>Daily goals</h2>
  <form method="dialog" id="goalsForm">
    <div class="goals-grid">
      <div><label for="gKcal">Calories (kcal)</label><input type="number" min="0" id="gKcal"></div>
      <div><label for="gProtein">Protein (g)</label><input type="number" min="0" id="gProtein"></div>
      <div><label for="gCarbs">Carbs (g)</label><input type="number" min="0" id="gCarbs"></div>
      <div><label for="gFat">Fat (g)</label><input type="number" min="0" id="gFat"></div>
    </div>
    <div class="actions">
      <button value="cancel" formnovalidate>Cancel</button>
      <button class="primary" value="save">Save</button>
    </div>
  </form>
</dialog>

<script>
(function () {
  const STORAGE_KEY = 'nutrition-tracker-v1';
  const MEALS = [
    { id: 'breakfast', label: 'Breakfast', emoji: '🍳' },
    { id: 'lunch',     label: 'Lunch',     emoji: '🥗' },
    { id: 'dinner',    label: 'Dinner',    emoji: '🍝' },
    { id: 'snack',     label: 'Snack',     emoji: '🍎' }
  ];
  const MACROS = [
    { key: 'protein', label: 'Protein', color: 'var(--protein)' },
    { key: 'carbs',   label: 'Carbs',   color: 'var(--carbs)' },
    { key: 'fat',     label: 'Fat',     color: 'var(--fat)' }
  ];

  // ---------- State ----------
  const defaultState = () => ({
    goals: { kcal: 2200, protein: 150, carbs: 220, fat: 70 },
    days: {},      // { 'YYYY-MM-DD': { breakfast: [food], lunch: [...], ... } }
    weights: {}    // { 'YYYY-MM-DD': kg }
  });

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return Object.assign(defaultState(), JSON.parse(raw));
    } catch (e) { /* storage unavailable: start fresh */ }
    return defaultState();
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
  }

  let state = load();
  let currentDate = toKey(new Date());

  // ---------- Helpers ----------
  function toKey(d) {
    const z = n => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate());
  }
  function fromKey(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); }
  function shiftDay(k, delta) { const d = fromKey(k); d.setDate(d.getDate() + delta); return toKey(d); }
  const num = v => { const n = parseFloat(v); return isFinite(n) && n >= 0 ? n : 0; };
  const fmt = n => Math.round(n).toLocaleString();
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function day(k) {
    if (!state.days[k]) state.days[k] = { breakfast: [], lunch: [], dinner: [], snack: [] };
    return state.days[k];
  }
  function sum(foods) {
    return foods.reduce((t, f) => ({
      kcal: t.kcal + f.kcal, protein: t.protein + f.protein, carbs: t.carbs + f.carbs, fat: t.fat + f.fat
    }), { kcal: 0, protein: 0, carbs: 0, fat: 0 });
  }

  // ---------- Render ----------
  const $ = id => document.getElementById(id);

  function renderHeader() {
    const d = fromKey(currentDate);
    const isToday = currentDate === toKey(new Date());
    $('dateLabel').textContent = (isToday ? 'Today · ' : '') +
      d.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    $('datePicker').value = currentDate;
  }

  function renderSummary() {
    const d = state.days[currentDate] || {};
    const totals = sum(MEALS.flatMap(m => d[m.id] || []));
    const g = state.goals;

    const pct = g.kcal ? Math.min(totals.kcal / g.kcal, 1) : 0;
    const C = 2 * Math.PI * 60;
    $('ringFg').style.strokeDashoffset = C * (1 - pct);
    $('ringFg').style.stroke = totals.kcal > g.kcal ? 'var(--danger)' : 'var(--kcal)';
    $('kcalEaten').textContent = fmt(totals.kcal);
    const left = g.kcal - totals.kcal;
    $('kcalLeft').innerHTML = left >= 0
      ? fmt(left) + ' kcal left'
      : '<span class="over">' + fmt(-left) + ' kcal over</span>';

    $('macroBars').innerHTML = MACROS.map(m => {
      const v = totals[m.key], goal = g[m.key];
      const w = goal ? Math.min(v / goal * 100, 100) : 0;
      const cls = goal && v > goal ? 'over' : 'muted';
      return '<div class="macro"><div class="row"><span><span class="dot" style="background:' + m.color + '"></span>' +
        m.label + '</span><span class="' + cls + '">' + fmt(v) + ' / ' + fmt(goal) + ' g</span></div>' +
        '<div class="bar"><span style="width:' + w + '%;background:' + m.color + '"></span></div></div>';
    }).join('');
  }

  function renderMeals() {
    const d = state.days[currentDate] || {};
    $('meals').innerHTML = MEALS.map(m => {
      const foods = d[m.id] || [];
      const t = sum(foods);
      const list = foods.length
        ? foods.map((f, i) =>
            '<div class="food"><div><div class="name">' + esc(f.name) + '</div>' +
            '<div class="macros-sm">P ' + fmt(f.protein) + 'g · C ' + fmt(f.carbs) + 'g · F ' + fmt(f.fat) + 'g</div></div>' +
            '<div class="kc">' + fmt(f.kcal) + ' kcal</div>' +
            '<button class="ghost icon" data-del="' + m.id + ':' + i + '" aria-label="Remove ' + esc(f.name) + '">✕</button></div>'
          ).join('')
        : '<div class="empty">Nothing logged yet</div>';
      return '<section class="card">' +
        '<div class="meal-head"><h2><span class="emoji">' + m.emoji + '</span>' + m.label + '</h2>' +
        '<span class="muted" style="font-size:13px">' + fmt(t.kcal) + ' kcal</span></div>' +
        list +
        '<form class="add-form" data-meal="' + m.id + '">' +
          '<div class="full"><label>Food</label><input name="name" required placeholder="e.g. Oatmeal with banana"></div>' +
          '<div><label>Protein g</label><input name="protein" type="number" step="0.1" min="0" placeholder="0"></div>' +
          '<div><label>Carbs g</label><input name="carbs" type="number" step="0.1" min="0" placeholder="0"></div>' +
          '<div><label>Fat g</label><input name="fat" type="number" step="0.1" min="0" placeholder="0"></div>' +
          '<div><label>kcal</label><input name="kcal" type="number" step="1" min="0" placeholder="auto"></div>' +
          '<button type="button" data-cancel>Cancel</button>' +
          '<button class="primary" type="submit" style="grid-column: span 3">Add</button>' +
        '</form>' +
        '<button class="add-btn" data-open="' + m.id + '">+ Add food</button>' +
        '</section>';
    }).join('');
  }

  function renderWeight() {
    const entries = Object.keys(state.weights).sort().map(k => ({ k, v: state.weights[k] }));
    const w = state.weights[currentDate];
    $('weightInput').value = w != null ? w : '';
    $('wToday').textContent = w != null ? w + ' kg' : '–';
    $('wCount').textContent = entries.length;

    // Last 30 days up to the selected date
    const from = shiftDay(currentDate, -29);
    const recent = entries.filter(e => e.k >= from && e.k <= currentDate);
    if (recent.length >= 2) {
      const diff = recent[recent.length - 1].v - recent[0].v;
      $('wChange').textContent = (diff > 0 ? '+' : '') + diff.toFixed(1) + ' kg';
    } else {
      $('wChange').textContent = '–';
    }

    const svg = $('weightChart');
    if (recent.length < 2) {
      svg.innerHTML = '<text x="150" y="60" text-anchor="middle" fill="var(--muted)" font-size="12">' +
        'Log at least 2 days to see your trend</text>';
      return;
    }
    const vals = recent.map(e => e.v);
    const min = Math.min(...vals), max = Math.max(...vals), span = (max - min) || 1;
    const t0 = fromKey(recent[0].k).getTime(), t1 = fromKey(recent[recent.length - 1].k).getTime();
    const pts = recent.map(e => {
      const x = 6 + (fromKey(e.k).getTime() - t0) / (t1 - t0) * 288;
      const y = 100 - (e.v - min) / span * 85;
      return [x, y];
    });
    const line = pts.map(p => p.map(n => n.toFixed(1)).join(',')).join(' ');
    svg.innerHTML =
      '<polygon points="' + pts[0][0] + ',108 ' + line + ' ' + pts[pts.length - 1][0] + ',108" fill="var(--accent)" opacity=".12"/>' +
      '<polyline points="' + line + '" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/>';
  }

  function render() { renderHeader(); renderSummary(); renderMeals(); renderWeight(); }

  // ---------- Events ----------
  $('prevDay').onclick = () => { currentDate = shiftDay(currentDate, -1); render(); };
  $('nextDay').onclick = () => { currentDate = shiftDay(currentDate, 1); render(); };
  $('todayBtn').onclick = () => { currentDate = toKey(new Date()); render(); };
  $('datePicker').onchange = e => { if (e.target.value) { currentDate = e.target.value; render(); } };

  $('meals').addEventListener('click', e => {
    const open = e.target.closest('[data-open]');
    if (open) {
      const form = open.previousElementSibling;
      form.classList.add('open'); open.style.display = 'none';
      form.querySelector('input').focus();
      return;
    }
    if (e.target.closest('[data-cancel]')) { renderMeals(); return; }
    const del = e.target.closest('[data-del]');
    if (del) {
      const [meal, i] = del.dataset.del.split(':');
      day(currentDate)[meal].splice(Number(i), 1);
      save(); render();
    }
  });

  $('meals').addEventListener('submit', e => {
    e.preventDefault();
    const f = e.target, data = new FormData(f);
    const protein = num(data.get('protein')), carbs = num(data.get('carbs')), fat = num(data.get('fat'));
    const kcalInput = data.get('kcal');
    // If calories are left blank, estimate them from macros (4 / 4 / 9 kcal per gram)
    const kcal = kcalInput !== '' ? num(kcalInput) : protein * 4 + carbs * 4 + fat * 9;
    day(currentDate)[f.dataset.meal].push({ name: String(data.get('name')).trim(), kcal, protein, carbs, fat });
    save(); render();
  });

  $('weightForm').addEventListener('submit', e => {
    e.preventDefault();
    const v = parseFloat($('weightInput').value);
    if (isFinite(v) && v > 0) state.weights[currentDate] = Math.round(v * 10) / 10;
    else delete state.weights[currentDate];
    save(); renderWeight();
  });

  const dlg = $('goalsDialog');
  $('goalsBtn').onclick = () => {
    $('gKcal').value = state.goals.kcal; $('gProtein').value = state.goals.protein;
    $('gCarbs').value = state.goals.carbs; $('gFat').value = state.goals.fat;
    dlg.showModal();
  };
  dlg.addEventListener('close', () => {
    if (dlg.returnValue !== 'save') return;
    state.goals = { kcal: num($('gKcal').value), protein: num($('gProtein').value), carbs: num($('gCarbs').value), fat: num($('gFat').value) };
    save(); renderSummary();
  });

  render();
})();
</script>
</body>
</html>
